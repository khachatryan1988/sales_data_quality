<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Sales Analytics
        {% endblock %}
    </title>

    <script
            src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --sidebar: #111827;
            --sidebar-hover: #1f2937;
            --primary: #2563eb;
            --purple: #7c3aed;
            --green: #0f766e;
            --red: #dc2626;
            --background: #f4f7fb;
            --card: #ffffff;
            --text: #172033;
            --muted: #64748b;
            --border: #e5e7eb;
        }

        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                var(--background);

            color:
                var(--text);
        }


        .sidebar {

            width: 245px;

            position: fixed;

            top: 0;
            bottom: 0;
            left: 0;

            background:
                var(--sidebar);

            color: white;

            padding:
                28px 18px;

            overflow-y: auto;
        }


        .logo {

            font-size: 21px;

            font-weight: 700;

            margin-bottom: 32px;

            line-height: 1.3;
        }


        .nav a {

            display: block;

            padding:
                12px 14px;

            margin-bottom: 6px;

            color: #cbd5e1;

            text-decoration: none;

            border-radius: 9px;

            transition: 0.15s ease;
        }


        .nav a:hover,
        .nav a.active {

            background:
                var(--sidebar-hover);

            color: white;
        }


        .nav a.active {

            box-shadow:
                inset 3px 0 0 #60a5fa;
        }


        .nav-separator {

            height: 1px;

            background: #273449;

            margin:
                16px 6px;
        }


        .content {

            margin-left: 245px;

            padding: 34px;

            min-height: 100vh;
        }


        .page-title {

            margin:
                0 0 4px;

            font-size: 31px;
        }


        .page-subtitle {

            color:
                var(--muted);

            margin-bottom: 28px;
        }


        .cards {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        180px,
                        1fr
                    )
                );

            gap: 16px;

            margin-bottom: 22px;
        }


        .card,
        .chart-card,
        .table-card {

            background:
                var(--card);

            border-radius: 14px;

            box-shadow:
                0 5px 20px
                rgba(
                    15,
                    23,
                    42,
                    0.05
                );
        }


        .card {
            padding: 21px;
        }


        .metric {

            font-size: 27px;

            font-weight: 700;

            overflow-wrap:
                anywhere;
        }


        .metric-label {

            margin-top: 6px;

            color:
                var(--muted);

            font-size: 14px;
        }


        .grid-2 {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 20px;

            margin-bottom: 20px;
        }


        .chart-card {
            padding: 20px;
        }


        .chart-card h3,
        .table-card h3 {

            margin-top: 0;
        }


        .chart-wrap {

            position: relative;

            height: 340px;
        }


        .chart-wrap.tall {
            height: 420px;
        }


        .table-card {

            padding: 20px;

            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse:
                collapse;
        }


        th,
        td {

            text-align: left;

            padding:
                11px 12px;

            border-bottom:
                1px solid
                var(--border);

            vertical-align: top;
        }


        th {

            background: #f8fafc;

            font-size: 13px;
        }


        td {

            font-size: 14px;
        }


        tr:hover td {

            background: #fbfdff;
        }


        .positive {

            color: #15803d;

            font-weight: bold;
        }


        .negative {

            color: #b91c1c;

            font-weight: bold;
        }


        .actions {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }


        .button {

            display: inline-block;

            text-decoration: none;

            color: white;

            padding:
                11px 17px;

            border-radius: 8px;

            font-size: 14px;
        }


        .button-primary {
            background:
                var(--primary);
        }


        .button-green {
            background:
                var(--green);
        }


        .button-purple {
            background:
                var(--purple);
        }


        .button-red {
            background:
                var(--red);
        }


        .button-gray {
            background: #475569;
        }


        @media (
            max-width: 1000px
        ) {

            .sidebar {
                width: 205px;
            }

            .content {

                margin-left:
                    205px;

                padding: 24px;
            }

            .grid-2 {
                grid-template-columns:
                    1fr;
            }

        }


        @media (
            max-width: 720px
        ) {

            .sidebar {

                position: static;

                width: 100%;
            }

            .content {

                margin-left: 0;

                padding: 18px;
            }

        }

    </style>

    {% block head %}
    {% endblock %}

</head>


<body>


{% set path = request.url.path %}


<aside class="sidebar">

    <div class="logo">
        Sales & Data Quality
    </div>

    <nav class="nav">

        <a
                href="/dashboard"
                class="
                {% if path == '/dashboard' %}
                active
                {% endif %}
            "
        >
            Executive Overview
        </a>


        <a
                href="/products"
                class="
                {% if path == '/products' %}
                active
                {% endif %}
            "
        >
            Product Analysis
        </a>


        <a
                href="/customers"
                class="
                {% if path == '/customers' %}
                active
                {% endif %}
            "
        >
            Customer Analysis
        </a>


        <a
                href="/promotions"
                class="
                {% if path == '/promotions' %}
                active
                {% endif %}
            "
        >
            Promotion Analysis
        </a>


        <a
                href="/data-quality"
                class="
                {% if path == '/data-quality' %}
                active
                {% endif %}
            "
        >
            Data Quality
        </a>


        <a
                href="/issues"
                class="
                {% if path == '/issues' %}
                active
                {% endif %}
            "
        >
            Issue Details
        </a>


        <div class="nav-separator">
        </div>


        <a href="/">
            Excel Upload
        </a>


        <a href="/report">
            Download Excel Report
        </a>

    </nav>

</aside>


<main class="content">

    {% block content %}
    {% endblock %}

</main>


{% block scripts %}
{% endblock %}


</body>

</html>
